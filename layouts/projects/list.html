{{ define "main" }}
  <article class="prose">
    <h1>{{ .Title }}</h1>
    {{ range .Pages.GroupByDate "2006" }}
      <section class="year-section">
        <h2 class="year-label">{{ .Key }}</h2>
        <ul class="work-list">
          {{ range .Pages }}
            <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
          {{ end }}
        </ul>
      </section>
    {{ end }}
  </article>
{{ end }}
