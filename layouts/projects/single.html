{{ define "main" }}
  {{ $iso := .Date.Format "2006-01-02" }}
  {{ $year := .Date.Format "2006" }}
  <article class="prose">
    <hgroup>
      <h1>{{ .Title }}</h1>
      <p class="meta"><time datetime="{{ $iso }}">{{ $year }}</time></p>
    </hgroup>

    {{ with .Params.headImage }}
      {{ $img := resources.Get . }}
      {{ if $img }}
        {{ $w := $img.Resize "1400x webp" }}
        <figure class="hero">
          <img
            src="{{ $w.RelPermalink }}"
            width="{{ $w.Width }}"
            height="{{ $w.Height }}"
            alt="{{ $.Params.headImageAlt }}"
            loading="eager"
            decoding="async"
          />
        </figure>
      {{ end }}
    {{ end }}

    {{ .Content }}
  </article>
{{ end }}
