{{ define "main" }}
  <article class="prose">
    <h1>{{ .Title }}</h1>
    {{ range .Pages.GroupByDate "2006" }}
      <section class="year-section prose">
        <h3 class="year-label">{{ .Key }}</h3>
        {{ range .Pages }}
          <article class="work-item">
            <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
          </article>
        {{ end }}
      </section>
    {{ end }}
  </article>
{{ end }}
