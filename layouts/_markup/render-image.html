{{ $res := resources.Get .Destination }}
{{ if $res }}
  {{ $webp := $res.Resize "800x webp" }}
  <img
    src="{{ $webp.RelPermalink }}"
    loading="lazy"
    decoding="async"
    width="{{ $webp.Width }}"
    height="{{ $webp.Height }}"
    alt="{{ .Text }}"
    {{ with .Attributes.class }}class="{{ . }}"{{ end }}
  />
{{ else }}
  <img src="{{ .Destination }}" alt="{{ .Text }}" />
{{ end }}
